name: olist-airflow
x-airflow: &airflow
  image: olist-airflow:3.3.2
  build: ./docker
  user: "${AIRFLOW_UID:-50000}:0"
  working_dir: /workspace
  env_file: .env
  environment: &environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://api-server:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: "python -c \"import sys; from pathlib import Path; sys.stdout.write('postgresql+psycopg2://airflow:'+Path('/run/secrets/postgres_password').read_text().strip()+'@postgres/airflow')\""
    AIRFLOW__API_AUTH__JWT_SECRET_CMD: cat /run/secrets/jwt_secret
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /run/secrets/passwords.json
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "10"
    PYTHONPATH: /workspace/src
    SNOWFLAKE_PRIVATE_KEY_PATH: /run/secrets/snowflake_key
    AWS_SHARED_CREDENTIALS_FILE: /run/aws/credentials
    AWS_CONFIG_FILE: /run/aws/config
    AWS_PROFILE: olist-elt-pipeline
    AWS_REGION: us-east-1
    S3_BUCKET: "${S3_BUCKET:?Set S3_BUCKET in ignored .env}"
    S3_RAW_PREFIX: olist/raw
    SNOWFLAKE_STAGE: OLIST_S3_STAGE
    OLIST_RUN_SNOWFLAKE_INTEGRATION: "1"
    OLIST_ENABLE_ORCHESTRATION_PROBES: "${OLIST_ENABLE_ORCHESTRATION_PROBES:-0}"
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./src:/workspace/src:ro
    - ./dbt:/workspace/dbt:ro
    - ./sql:/workspace/sql:ro
    - ./tests:/workspace/tests:ro
    - ./reports:/workspace/reports:ro
    - ./data/raw:/workspace/data/raw:ro
    - ./data/processed:/workspace/data/processed
    - airflow-logs:/opt/airflow/logs
    - ${SNOWFLAKE_PRIVATE_KEY_PATH:?Set key path in ignored .env}:/run/secrets/snowflake_key:ro
    - ${HOME}/.aws:/run/aws:ro
    - ./data/processed/airflow/postgres_password:/run/secrets/postgres_password:ro
    - ./data/processed/airflow/jwt_secret:/run/secrets/jwt_secret:ro
    - ./data/processed/airflow/passwords.json:/run/secrets/passwords.json
  depends_on:
    postgres:
      condition: service_healthy
    init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16.13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_DB: airflow
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - airflow-db:/var/lib/postgresql/data
      - ./data/processed/airflow/postgres_password:/run/secrets/postgres_password:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U airflow"]
      interval: 5s
      retries: 12
  init:
    <<: *airflow
    command: [bash, -c, "airflow db migrate && airflow pools set olist_writer 1 'Serialized Olist pipeline writer'"]
    depends_on:
      postgres:
        condition: service_healthy
  api-server:
    <<: *airflow
    command: api-server
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8080/api/v2/monitor/health]
      interval: 15s
      retries: 12
  scheduler:
    <<: *airflow
    command: scheduler
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8974/health]
      interval: 15s
      retries: 12
  dag-processor:
    <<: *airflow
    command: dag-processor
    healthcheck:
      test: [CMD-SHELL, "airflow jobs check --job-type DagProcessorJob --hostname $${HOSTNAME}"]
      interval: 30s
      retries: 6

volumes:
  airflow-db:
  airflow-logs:
