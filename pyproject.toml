[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-elt-pipeline"
version = "0.4.0"
description = "Orchestrated ELT and data-quality pipeline for the Olist public dataset"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Project Maintainers"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
]
cloud = [
  "boto3>=1.34,<2",
  "snowflake-connector-python>=3.12,<4; python_version<'3.10'",
  "snowflake-connector-python>=4,<5; python_version>='3.10'",
]
transform = [
  "dbt-core>=1.12,<1.13; python_version>='3.10'",
  "dbt-snowflake>=1.11.4,<1.13; python_version>='3.10'",
]

[project.scripts]
olist-profile = "olist_pipeline.profiling:main"
olist-validate = "olist_pipeline.validation:main"
olist-ingest = "olist_pipeline.ingestion:main"
olist-warehouse = "olist_pipeline.warehouse:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
