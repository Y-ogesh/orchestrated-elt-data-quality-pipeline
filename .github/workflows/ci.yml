name: Local validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install local validation dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev,transform]'

      - name: Run final local and static checks
        env:
          SNOWFLAKE_ACCOUNT: static-parse-placeholder
          SNOWFLAKE_USER: static-parse-placeholder
          SNOWFLAKE_ROLE: static-parse-placeholder
          SNOWFLAKE_WAREHOUSE: static-parse-placeholder
          SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/static-parse-placeholder.p8
        run: |
          cp dbt/profiles.yml.example dbt/profiles.yml
          make final-check
