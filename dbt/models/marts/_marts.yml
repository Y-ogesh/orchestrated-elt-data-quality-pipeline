version: 2

models:
  - name: dim_customer
    description: Person-level customer dimension; grain is one customer_unique_id.
    columns:
      - name: customer_key
        description: Deterministic SHA-256 surrogate key for the person-level customer.
        data_tests: [not_null, unique]
      - name: customer_unique_id
        data_tests: [not_null, unique]
  - name: dim_order_customer
    description: Order-specific delivery-customer dimension; grain is one customer_id.
    columns:
      - name: order_customer_key
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests: [not_null, unique]
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: geography_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key
  - name: dim_product
    description: Product dimension; grain is one product_id.
    columns:
      - name: product_key
        data_tests: [not_null, unique]
      - name: product_id
        data_tests: [not_null, unique]
      - name: category_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_category')
                field: category_key
  - name: dim_seller
    description: Seller dimension; grain is one seller_id.
    columns:
      - name: seller_key
        data_tests: [not_null, unique]
      - name: seller_id
        data_tests: [not_null, unique]
      - name: geography_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key
  - name: dim_category
    description: Product category dimension with explicit unknown and untranslated states.
    columns:
      - name: category_key
        data_tests: [not_null, unique]
      - name: product_category_name
        data_tests: [not_null, unique]
      - name: translation_status
        data_tests:
          - accepted_values:
              arguments:
                values: [translated, untranslated, unknown]
  - name: dim_geography
    description: Postal-prefix geography dimension plus one unknown member.
    columns:
      - name: geography_key
        data_tests: [not_null, unique]
      - name: postal_code_prefix
        data_tests: [not_null, unique]
  - name: dim_date
    description: Calendar dimension spanning every date referenced by an order, item, or review.
    columns:
      - name: date_key
        data_tests: [not_null, unique]
      - name: date_day
        data_tests: [not_null, unique]
  - name: fct_orders
    description: One order with independently aggregated item and payment measures.
    columns:
      - name: order_key
        data_tests: [not_null, unique]
      - name: order_id
        data_tests: [not_null, unique]
      - name: order_customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_order_customer')
                field: order_customer_key
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: purchase_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
  - name: fct_order_items
    description: One merchandise line per order_id and order_item_id.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, order_item_id]
    columns:
      - name: order_item_key
        data_tests: [not_null, unique]
      - name: order_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_key
      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: seller_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_seller')
                field: seller_key
      - name: shipping_limit_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
  - name: fct_order_payments
    description: One payment component per order_id and payment_sequential.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, payment_sequential]
    columns:
      - name: payment_key
        data_tests: [not_null, unique]
      - name: order_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_key
      - name: payment_value
        data_tests: [not_null]
  - name: fct_order_reviews
    description: One distinct normalized source review record.
    columns:
      - name: review_key
        data_tests: [not_null, unique]
      - name: order_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_key
      - name: review_creation_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
